global:
  resolve_timeout: 5m


route:
  receiver: telegram

  group_by:
    - alertname
    - job

  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:

    - receiver: telegram
      matchers:
        - severity="critical"

      group_wait: 5s
      group_interval: 1m
      repeat_interval: 1h


    - receiver: telegram
      matchers:
        - severity="warning"

      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h


receivers:

  - name: telegram

    telegram_configs:

      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id

        send_resolved: true
        parse_mode: ""

        message: |
          {{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }}

          {{ range .Alerts }}
          Alert: {{ .Labels.alertname }}
          Severity: {{ .Labels.severity }}
          Environment: {{ .Labels.env }}
          Instance: {{ .Labels.instance }}
          Job: {{ .Labels.job }}

          {{ .Annotations.summary }}
          {{ .Annotations.description }}

          {{ end }}


inhibit_rules:

  - source_matchers:
      - severity="critical"

    target_matchers:
      - severity="warning"

    equal:
      - instance