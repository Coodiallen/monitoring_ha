global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  # ==========================================================
  # Prometheus self-monitoring
  # ==========================================================

  - job_name: prometheus

    scheme: https

    basic_auth:
      username: grafana
      password_file: /run/secrets/prometheus_basic_auth_password

    tls_config:
      ca_file: /etc/prometheus/certs/ca.crt
      server_name: prometheus

    static_configs:
      - targets:
          - prometheus:9090


  # ==========================================================
  # File-based service discovery
  # ==========================================================

  - job_name: discovered-targets

    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json

        refresh_interval: 30s

    relabel_configs:

      # Use "service" from target files as the real Prometheus
      # job label. This keeps existing dashboards and alerts
      # compatible with job="grafana", job="postgres", etc.
      - source_labels:
          - service

        target_label: job

      # service is only an intermediate discovery label.
      - action: labeldrop
        regex: service