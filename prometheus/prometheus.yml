global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus

    scheme: https

    basic_auth:
      username: grafana
      password_file: /run/secrets/prometheus_basic_auth_password

    tls_config:
      ca_file: /etc/prometheus/certs/ca.crt
      server_name: prometheus

    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node-exporter

    static_configs:
      - targets:
          - node-exporter:9100
