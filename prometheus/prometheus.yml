global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus

    scheme: https

    basic_auth:
      username: grafana
      password_file: /run/secrets/prometheus_basic_auth_password

    tls_config:
      ca_file: /etc/prometheus/certs/ca.crt
      server_name: prometheus

    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node-exporter

    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: nginx
    static_configs:
      - targets:
          - nginx-exporter:9113

  - job_name: grafana
    metrics_path: /metrics

    static_configs:
      - targets:
          - grafana-1:3000
          - grafana-2:3000

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080