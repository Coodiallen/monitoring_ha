global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    type: external
    cluster: monitoring-ha
    replica: replica


rule_files:
  - /etc/prometheus/rules/*.yml


alerting:

  alert_relabel_configs:
    - action: labeldrop
      regex: replica

  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093


scrape_configs:

  # ==========================================================
  # Self-monitoring
  # ==========================================================

  - job_name: prometheus

    scheme: https

    basic_auth:
      username: grafana
      password_file: /run/secrets/prometheus_basic_auth_password

    tls_config:
      ca_file: /etc/prometheus/certs/ca.crt
      server_name: prometheus-replica

    static_configs:
      - targets:
          - prometheus-replica:9090


  # ==========================================================
  # HA peer - primary Prometheus
  # ==========================================================

  - job_name: prometheus-peer

    scheme: https

    basic_auth:
      username: grafana
      password_file: /run/secrets/prometheus_basic_auth_password

    tls_config:
      ca_file: /etc/prometheus/certs/ca.crt
      server_name: prometheus

    static_configs:
      - targets:
          - prometheus:9090


  # ==========================================================
  # File-based service discovery
  # ==========================================================

  - job_name: discovered-targets

    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json

        refresh_interval: 30s

    relabel_configs:

      - source_labels:
          - service

        target_label: job

      - action: labeldrop
        regex: service


  # ==========================================================
  # Pushgateway
  # ==========================================================

  - job_name: pushgateway

    honor_labels: true

    file_sd_configs:
      - files:
          - /etc/prometheus/targets/pushgateway/*.json

        refresh_interval: 30s
